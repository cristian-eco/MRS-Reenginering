name: CineMatch CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-security:
    name: Build, Test & Security Pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código fuente
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar entorno de Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Instalación de dependencias
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov selenium webdriver-manager requests-mock bandit

      # 4. Configurar Chrome Headless para Selenium
      - name: Set up Chrome for Selenium
        uses: browser-actions/setup-chrome@v1

      # 5. Ejecutar ÚNICAMENTE Pruebas Unitarias e ignorar Selenium por ahora
      - name: Run Unit Tests & Coverage
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          pytest tests/test_models.py tests/test_recommendations.py tests/test_strategies.py --cov=app --cov=models --cov-report=term-missing

      # 6. Levantar la Aplicación Flask en Segundo Plano
      - name: Start Flask App Server
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python run.py &
          echo "Esperando 10 segundos a que la app inicie en http://127.0.0.1:5000 ..."
          sleep 10

      # 7. Ejecutar ÚNICAMENTE las Pruebas E2E de Selenium
      - name: Run Selenium E2E Tests
        run: |
          pytest tests/test_e2e.py -v

      # 8. Auditoría de Seguridad con Bandit
      - name: Security Audit with Bandit
        run: |
          bandit -r app/ models/ config/ -ll -ii || true

      # 9. Compilacion de la Imagen Docker
      - name: Build Docker Image
        run: |
          docker build -t cinematch:latest .

      # 10. Escaneo de Vulnerabilidades con Trivy
      - name: Security Scan Container Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cinematch:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'